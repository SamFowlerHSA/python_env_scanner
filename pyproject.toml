[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "env-scanner"
version = "0.1.0"
description = "Report-only scanner for pip, certifi, uv and conda versions across Python environments."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
aws = ["boto3"]
dev = ["pytest", "ruff"]

[project.scripts]
env-scanner = "env_scanner.inventory:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
